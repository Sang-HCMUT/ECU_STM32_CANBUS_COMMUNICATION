<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAN Bus Dashboard</title>
    <!-- Three.js and Loaders -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap');
        
        :root {
            --bg-dark: #07090f;
            --bg-panel: #111522;
            --text-main: #ffffff;
            --text-dim: #738096;
            --accent: #007aff;
            --danger: #ff3b30;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100vh;
            background-color: #000;
            font-family: 'Montserrat', sans-serif;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
            color: var(--text-main);
        }

        /* The Main Screen */
        .dashboard-screen {
            width: 100vw; height: 100vh;
            background: linear-gradient(135deg, #090c15, #040508);
            display: flex; flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Top Status Bar */
        .top-bar {
            height: 40px; display: flex; justify-content: space-between; align-items: center;
            padding: 0 30px; font-size: 12px; font-weight: 500; color: var(--text-dim);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .top-bar-left { display: flex; align-items: center; gap: 15px;}
        .top-bar-left .battery { color: #34c759; font-weight: 700; display: flex; align-items: center; gap: 5px;}
        .top-bar-center { font-size: 14px; font-weight: 600; color: #fff;}
        .top-bar-right { display: flex; align-items: center; gap: 15px;}

        /* Main Content Area */
        .main-area {
            flex: 1; display: flex; height: calc(100% - 120px);
        }

        /* Left Sidebar (Toolbar) */
        .sidebar {
            width: 70px; display: flex; flex-direction: column; align-items: center;
            padding: 20px 0; gap: 30px; border-right: 1px solid rgba(255,255,255,0.05);
            background: rgba(0,0,0,0.2);
        }
        .side-btn {
            font-size: 20px; color: var(--text-dim); cursor: pointer; transition: 0.2s;
        }
        .side-btn:hover, .side-btn.active { color: #fff; }
        .drive-mode {
            font-size: 10px; font-weight: 700; text-align: center; line-height: 1.2;
            color: var(--text-dim); margin-top: -10px;
        }

        /* 3D Car Section (Center-Left) */
        .car-section {
            flex: 1.2; position: relative; border-right: 1px solid rgba(255,255,255,0.05);
            display: flex; flex-direction: column;
        }
        .gear-indicator {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 64px;
            font-weight: 300;
            color: #fff;
            letter-spacing: 5px;
            text-shadow: 0 0 20px rgba(255,255,255,0.3);
            transition: color 0.3s, transform 0.3s;
            z-index: 10;
        }
        .abs-indicator {
            position: absolute;
            top: 120px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 3px solid #ffaa00;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffaa00;
            font-weight: 800;
            font-size: 16px;
            opacity: 0.1;
            transition: all 0.1s;
            z-index: 10;
        }
        .abs-indicator.active {
            opacity: 1;
            background-color: rgba(255, 170, 0, 0.2);
            box-shadow: 0 0 15px rgba(255, 170, 0, 0.5);
        }
        
        .pedal-gauges {
            width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1;
        }
        #car-canvas {
            width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1;
        }

        /* UI Overlays on Car Section */
        .car-ui-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none;
        }
        .lock-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            width: 40px; height: 40px;
            display: flex; justify-content: center; align-items: center;
            position: absolute;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s;
            pointer-events: auto;
        }
        .lock-btn:hover { background: rgba(255,255,255,0.2); transform: scale(1.1); }
        .lock-btn.unlocked { background: rgba(52, 199, 89, 0.2); border-color: #34c759; color: #34c759; }
        .lock-left { top: 40%; left: 30px; }
        .lock-right { top: 40%; right: 30px; }
        .lock-trunk { bottom: 80px; left: 50%; transform: translateX(-50%); }

        /* Toast Notification */
        .toast-notify {
            position: absolute;
            top: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s, transform 0.5s;
            z-index: 100;
        }
        .toast-notify.show {
            opacity: 1;
            transform: translate(-50%, 10px);
        }

        .speed-overlay {
            position: absolute; bottom: 30px; left: 30px; 
            width: 220px; height: 220px;
            display: flex; justify-content: center; align-items: center;
        }
        .gauge-svg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        }
        .gauge-bg {
            fill: none; stroke: rgba(255,255,255,0.05); stroke-width: 12; stroke-linecap: round;
        }
        .gauge-progress {
            fill: none; stroke: url(#gradient-rpm); stroke-width: 12; stroke-linecap: round;
            stroke-dasharray: 377; stroke-dashoffset: 377;
            transition: stroke-dashoffset 0.1s ease-out;
            filter: drop-shadow(0 0 10px rgba(0, 255, 204, 0.5));
        }
        .gauge-text {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            margin-top: 20px; z-index: 10;
        }
        .speed-val { font-size: 64px; font-weight: 700; line-height: 1; margin-bottom: -5px; text-shadow: 0 0 15px rgba(255,255,255,0.4); }
        .speed-unit { font-size: 14px; font-weight: 600; color: var(--text-dim);}
        .rpm-val { font-size: 18px; font-weight: 700; color: #00ffcc; margin-top: 5px; text-shadow: 0 0 10px rgba(0,255,204,0.5); }

        /* Right Section (Map & Media) */
        .right-section {
            flex: 1.8; display: flex; flex-direction: column; padding: 20px; gap: 20px;
        }

        /* Top Row of Right Section */
        .right-top-row { display: flex; gap: 20px; flex: 1.5; }
        
        /* Map Box */
        .map-box {
            flex: 2; border-radius: 15px; overflow: hidden; position: relative;
            background: url('https://images.unsplash.com/photo-1524661135-423995f22d0b?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80') center/cover;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
        }
        .map-ui {
            position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px); padding: 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
        }
        .map-ui h2 { margin: 0; font-size: 28px; font-weight: 400;}
        .map-ui p { margin: 5px 0 0 0; color: var(--text-dim); font-size: 12px;}

        /* Media Box */
        .media-box {
            flex: 1; border-radius: 15px; background: var(--bg-panel); padding: 20px;
            display: flex; flex-direction: column; border: 1px solid rgba(255,255,255,0.05);
        }
        .album-art {
            width: 60px; height: 60px;
            border-radius: 8px;
            background: url('https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?auto=format&fit=crop&w=100&q=80') center/cover;
            transition: transform 0.5s;
        }
        .album-art.spinning {
            animation: spinArt 4s linear infinite;
            border-radius: 50%;
        }
        @keyframes spinArt { 100% { transform: rotate(360deg); } }
        .media-title { font-size: 18px; font-weight: 600; margin: 10px 0 5px; }
        .media-artist { font-size: 14px; color: #a0aec0; margin-bottom: 15px; }
        .media-controls {
            display: flex; justify-content: center; gap: 20px; align-items: center;
            font-size: 20px; color: #fff;
        }
        .media-controls i { cursor: pointer; transition: color 0.2s; }
        .media-controls i:hover { color: var(--accent); }
        .play-btn {
            width: 50px; height: 50px; border-radius: 50%; background: #fff; color: #000;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            transition: transform 0.2s;
        }
        .play-btn:hover { transform: scale(1.1); }

        /* Bottom Row of Right Section (Apps/Settings) */
        .right-bottom-row {
            flex: 1; border-radius: 15px; background: var(--bg-panel); padding: 20px;
            border: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: space-around;
        }
        .app-icon {
            display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--text-dim); font-size: 12px;
        }
        .app-icon i {
            width: 50px; height: 50px; border-radius: 15px; background: rgba(255,255,255,0.05);
            display: flex; justify-content: center; align-items: center; font-size: 24px; color: #fff;
        }

        /* Bottom Climate Bar */
        .climate-bar {
            height: 80px; background: #0b0e17; display: flex; align-items: center; justify-content: space-between;
            padding: 0 40px; border-top: 1px solid rgba(255,255,255,0.05);
        }
        .climate-group { display: flex; align-items: center; gap: 15px; }
        .climate-group i { cursor: pointer; transition: color 0.2s, transform 0.2s; }
        .climate-group i:hover { color: var(--accent); transform: scale(1.2); }
        .seat-heat.active { color: #FF3333; }
        .temp-val { font-size: 24px; font-weight: 600; width: 60px; text-align: center; }

        /* Gauges (Throttle/Brake overlaid on Car Section) */
        .pedal-gauges {
            position: absolute; bottom: 30px; right: 30px; display: flex; gap: 20px; pointer-events: auto;
        }
        .pedal-bar-container {
            width: 40px; height: 120px; background: rgba(0,0,0,0.5); border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1); position: relative; overflow: hidden;
            display: flex; flex-direction: column; justify-content: flex-end;
        }
        .pedal-fill {
            width: 100%; background: var(--accent); transition: 0.1s linear; height: 0%;
        }
        .pedal-fill.brake { background: var(--danger); }
        .pedal-label { position: absolute; top: 10px; width: 100%; text-align: center; font-size: 10px; font-weight: 700; color: #fff; z-index: 2;}

        /* Connection Button */
        #btnConnect {
            background: var(--accent); color: #fff; border: none; padding: 5px 15px;
            border-radius: 15px; cursor: pointer; font-family: 'Montserrat'; font-weight: 600; font-size: 12px;
        }
        #btnConnect.connected { background: #34c759; }

        /* Crash Overlay */
        #crash-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 59, 48, 0.2); z-index: 100; pointer-events: none;
            opacity: 0; transition: opacity 0.2s; box-shadow: inset 0 0 100px rgba(255,59,48,0.8);
        }

    </style>
</head>
<body>

    <!-- Debug Text to show raw data -->
    <div id="debug-text" style="position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); color: #888; font-family: monospace; font-size: 12px; z-index: 9999; pointer-events: none;">
        Waiting for data...
    </div>

    <div class="dashboard-screen">
        <div id="crash-overlay"></div>

        <!-- Top Status Bar -->
        <div class="top-bar">
            <div class="top-bar-left">
                <div class="battery"><i class="fa-solid fa-battery-three-quarters"></i> 74%</div>
                <div>240 KM</div>
            </div>
            <div class="top-bar-center" style="display:flex; gap: 15px; align-items: center;">
                <span id="eps-link" style="color: #738096;"><i class="fa-solid fa-link"></i> EPS</span>
                <span id="abs-link" style="color: #738096;"><i class="fa-solid fa-link"></i> ABS</span>
                <span id="can-bus" style="color: #738096;"><i class="fa-solid fa-network-wired"></i> CAN OK</span>
            </div>
            <div class="top-bar-right">
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-brands fa-bluetooth-b"></i>
                <div>11:30 AM</div>
                <button id="btnConnect" onclick="connectSerial()">CONNECT</button>
            </div>
        </div>

        <div class="main-area">
            <!-- Sidebar -->
            <div class="sidebar">
                <div class="side-btn"><i class="fa-solid fa-car"></i></div>
                <div class="side-btn"><i class="fa-solid fa-lightbulb"></i></div>
                <div class="side-btn"><i class="fa-solid fa-fan"></i></div>
                <div class="drive-mode">DRIVE<br>MODE</div>
                <div class="side-btn active"><i class="fa-solid fa-map-location-dot"></i></div>
                <div class="side-btn"><i class="fa-solid fa-camera"></i></div>
                <div class="side-btn"><i class="fa-solid fa-music"></i></div>
            </div>

            <!-- Car 3D Area -->
            <div class="car-section">
                <div id="car-canvas"></div>
                
                <div class="car-ui-overlay">
                    <!-- Gear Indicator -->
                    <div class="gear-indicator" id="gear-indicator">P</div>
                    <div class="abs-indicator" id="abs-indicator">ABS</div>
                    <div class="toast-notify" id="toast-notify">Doors Locked</div>
                    
                    <!-- Bottom UI: Speed & Pedals -->
                    <div class="car-ui-overlay">
                        <div class="lock-btn lock-left unlocked" id="lock-left" onclick="toggleLock(this)"><i class="fa-solid fa-unlock"></i></div>
                        <div class="lock-btn lock-right unlocked" id="lock-right" onclick="toggleLock(this)"><i class="fa-solid fa-unlock"></i></div>
                        <div class="lock-btn lock-trunk unlocked" id="lock-trunk" onclick="toggleLock(this)"><i class="fa-solid fa-unlock"></i></div>

                        <div class="speed-overlay">
                            <svg class="gauge-svg" viewBox="0 0 200 200">
                                <defs>
                                    <linearGradient id="gradient-rpm" x1="0%" y1="100%" x2="100%" y2="0%">
                                        <stop offset="0%" stop-color="#00ffcc" />
                                        <stop offset="50%" stop-color="#0066ff" />
                                        <stop offset="100%" stop-color="#ff0055" />
                                    </linearGradient>
                                </defs>
                                <path class="gauge-bg" d="M 40 160 A 80 80 0 1 1 160 160" />
                                <path class="gauge-progress" id="rpm-arc" d="M 40 160 A 80 80 0 1 1 160 160" />
                            </svg>
                            <div class="gauge-text">
                                <div class="speed-val" id="val-kmh">0</div>
                                <div class="speed-unit">KM/H</div>
                                <div class="rpm-val" id="val-rpm">0 RPM</div>
                            </div>
                        </div>
                        
                        <!-- Pedal Gauges Moved Inside Car Area -->
                        <div class="pedal-gauges">
                            <div class="pedal-bar-container">
                                <div class="pedal-label">THR</div>
                                <div class="pedal-fill" id="bar-thr"></div>
                            </div>
                            <div class="pedal-bar-container">
                                <div class="pedal-label">BRK</div>
                                <div class="pedal-fill brake" id="bar-brk"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Section -->
            <div class="right-section">
                <!-- Top Row -->
                <div class="right-top-row">
                    <div class="map-box">
                        <div class="map-ui">
                            <h2><i class="fa-solid fa-diamond-turn-right"></i> <span id="map-dist">850</span>m</h2>
                            <p>Exit NE 75th St</p>
                        </div>
                    </div>

                    <div class="media-box">
                        <div class="album-art" id="album-art"></div>
                        <div class="media-title" id="media-title">Midnight City</div>
                        <div class="media-artist">M83 • Bluetooth</div>
                        <div class="media-controls">
                            <i class="fa-solid fa-backward-step" onclick="changeTrack(-1)"></i>
                            <div class="play-btn" onclick="togglePlay()"><i class="fa-solid fa-play" id="play-icon"></i></div>
                            <i class="fa-solid fa-forward-step" onclick="changeTrack(1)"></i>
                        </div>
                    </div>
                </div>

                <!-- Bottom Row -->
                <div class="right-bottom-row">
                    <div class="app-icon">
                        <i class="fa-solid fa-play" style="color:#34c759;"></i>
                        Apple CarPlay
                    </div>
                    <div class="app-icon">
                        <i class="fa-brands fa-android" style="color:#007aff;"></i>
                        Android Auto
                    </div>
                    <div class="app-icon">
                        <i class="fa-solid fa-bolt" style="color:#34c759;"></i>
                        EV Settings
                    </div>
                    <div class="app-icon">
                        <i class="fa-solid fa-phone" style="color:#34c759;"></i>
                        Phone
                    </div>
                    <div class="app-icon">
                        <i class="fa-solid fa-gear" style="color:#738096;"></i>
                        Settings
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom Climate Bar -->
        <div class="climate-bar">
            <div class="climate-group">
                <i class="fa-solid fa-car-side"></i>
                <i class="fa-solid fa-seat-airline seat-heat" onclick="this.classList.toggle('active')"></i>
                <div class="temp-val" id="temp-left">22°C</div>
                <div style="display:flex; flex-direction:column; gap:5px;">
                    <i class="fa-solid fa-chevron-up" onclick="adjTemp('temp-left', 1)"></i>
                    <i class="fa-solid fa-chevron-down" onclick="adjTemp('temp-left', -1)"></i>
                </div>
            </div>
            <div class="climate-group" style="gap:40px;">
                <i class="fa-solid fa-fan" id="fan-icon"></i>
                <i class="fa-solid fa-wind"></i>
                <i class="fa-solid fa-snowflake" style="color:var(--accent);" id="ac-icon" onclick="this.style.color = this.style.color === 'gray' ? 'var(--accent)' : 'gray'"></i>
            </div>
            <div class="climate-group">
                <div style="display:flex; flex-direction:column; gap:5px;">
                    <i class="fa-solid fa-chevron-up" onclick="adjTemp('temp-right', 1)"></i>
                    <i class="fa-solid fa-chevron-down" onclick="adjTemp('temp-right', -1)"></i>
                </div>
                <div class="temp-val" id="temp-right">22°C</div>
                <i class="fa-solid fa-seat-airline seat-heat" onclick="this.classList.toggle('active')"></i>
                <i class="fa-solid fa-grip"></i>
            </div>
        </div>

    </div>

    <!-- MAIN SCRIPT: 3D CAR AND SERIAL API -->
    <script>
        // ==========================================
        // 1. THREE.JS 3D SUV MODEL GENERATOR
        // ==========================================
        const container = document.getElementById('car-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(30, container.clientWidth / container.clientHeight, 0.1, 1000);
        // Position camera behind and above the car for a VinFast-like Top-Down view
        camera.position.set(0, 12, 12); 
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        container.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
        dirLight.position.set(-10, 15, -10);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        const spotLight = new THREE.SpotLight(0xffffff, 2.5);
        spotLight.position.set(10, 10, 10);
        spotLight.angle = Math.PI / 4;
        scene.add(spotLight);

        // Car Group
        const carGroup = new THREE.Group();
        scene.add(carGroup);

        // Floor Shadow Catcher
        const floorGeo = new THREE.PlaneGeometry(20, 20);
        const floorMat = new THREE.ShadowMaterial({ opacity: 0.5 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Loading Text
        const loadingDiv = document.createElement('div');
        loadingDiv.style.position = 'absolute';
        loadingDiv.style.top = '50%';
        loadingDiv.style.left = '50%';
        loadingDiv.style.transform = 'translate(-50%, -50%)';
        loadingDiv.style.color = '#fff';
        loadingDiv.style.fontFamily = 'Montserrat';
        loadingDiv.innerText = 'Loading 3D Model...';
        container.appendChild(loadingDiv);

        // Load Real GLTF Car Model
        let frontLeftWheel, frontRightWheel;
        const loader = new THREE.GLTFLoader();
        const dracoLoader = new THREE.DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.4.1/');
        loader.setDRACOLoader(dracoLoader);

        loader.load(
            'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/models/gltf/ferrari.glb',
            function ( gltf ) {
                const carModel = gltf.scene;
                
                // Position and scale the model
                carModel.scale.set(1.5, 1.5, 1.5);
                carModel.position.y = 0;
                
                // Natively face UP (-Z). If it was pointing DOWN, it means Math.PI reversed it.
                carModel.rotation.y = 0; 

                // Add shiny environment map for realism
                const pmremGenerator = new THREE.PMREMGenerator(renderer);
                pmremGenerator.compileEquirectangularShader();
                const envMap = pmremGenerator.fromScene(new THREE.Scene()).texture; // Simple fallback env map

                // Try to identify front wheels by robust case-insensitive name
                carModel.traverse((child) => {
                    let name = child.name.toLowerCase();
                    if (name === 'wheel_fl') {
                        frontLeftWheel = child; 
                        frontLeftWheel.userData.initialRotZ = child.rotation.z;
                    }
                    if (name === 'wheel_fr') {
                        frontRightWheel = child;
                        frontRightWheel.userData.initialRotZ = child.rotation.z;
                    }
                    
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                        
                        // Make body black/grey carbon
                        if (name.includes('body')) {
                            child.material = new THREE.MeshStandardMaterial({
                                color: 0x222222, metalness: 0.9, roughness: 0.1, envMap: envMap
                            });
                        }
                    }
                });

                carGroup.add(carModel);
                container.removeChild(loadingDiv); // Remove loading text
            },
            undefined,
            function ( error ) {
                console.error( "Lỗi tải mô hình 3D:", error );
                loadingDiv.innerText = 'Đang dùng mô hình 3D mặc định...';
                
                // --- FALLBACK 3D CAR ---
                const carBodyGeo = new THREE.BoxGeometry(2, 0.8, 4);
                const carBodyMat = new THREE.MeshStandardMaterial({color: 0x222222, metalness: 0.8, roughness: 0.2});
                const carBody = new THREE.Mesh(carBodyGeo, carBodyMat);
                carBody.position.y = 0.6;
                carBody.castShadow = true;
                
                const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.2, 32);
                wheelGeo.rotateZ(Math.PI / 2);
                const wheelMat = new THREE.MeshStandardMaterial({color: 0x111111});
                
                frontLeftWheel = new THREE.Mesh(wheelGeo, wheelMat);
                frontLeftWheel.position.set(-1.1, 0.4, -1.2);
                frontLeftWheel.userData.initialRotZ = 0;
                scene.add(frontLeftWheel); // Add to scene so rotation works easier
                
                frontRightWheel = new THREE.Mesh(wheelGeo, wheelMat);
                frontRightWheel.position.set(1.1, 0.4, -1.2);
                frontRightWheel.userData.initialRotZ = 0;
                scene.add(frontRightWheel);
                
                const rearLeftWheel = new THREE.Mesh(wheelGeo, wheelMat);
                rearLeftWheel.position.set(-1.1, 0.4, 1.2);
                scene.add(rearLeftWheel);
                
                const rearRightWheel = new THREE.Mesh(wheelGeo, wheelMat);
                rearRightWheel.position.set(1.1, 0.4, 1.2);
                scene.add(rearRightWheel);
                
                carGroup.add(carBody);
                carGroup.add(frontLeftWheel);
                carGroup.add(frontRightWheel);
                carGroup.add(rearLeftWheel);
                carGroup.add(rearRightWheel);
                
                setTimeout(() => { if (loadingDiv.parentNode) container.removeChild(loadingDiv); }, 1000);
            }
        );

        // Render Loop State
        let targetPitch = 0, targetRoll = 0, targetTurn = 0;
        let currentTurn = 0;
        let isCrashedState = false;

        function animate() {
            requestAnimationFrame(animate);
            
            // Apply Pitch & Roll from MPU6050
            carGroup.rotation.x += (targetPitch - carGroup.rotation.x) * 0.1;
            carGroup.rotation.z += (targetRoll - carGroup.rotation.z) * 0.1;
            currentTurn += (targetTurn - currentTurn) * 0.1;
            
            if (isCrashedState) {
                carGroup.rotation.y += 0.1; // Spin out
            } else {
                // Steer the whole car slightly for visual feedback
                let desiredY = currentTurn * 0.5;
                carGroup.rotation.y += (desiredY - carGroup.rotation.y) * 0.1;
            }

            // Smoothly interpolate Front Wheels (Steering) if found in GLTF
            if (frontLeftWheel && frontRightWheel) {
                frontLeftWheel.rotation.z = frontLeftWheel.userData.initialRotZ + currentTurn;
                frontRightWheel.rotation.z = frontRightWheel.userData.initialRotZ + currentTurn;
            }

            renderer.render(scene, camera);
        }
        animate();

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // ==========================================
        // 2. WEB SERIAL API & LOGIC
        // ==========================================
        let port, reader;
        
        // MPU Variables
        let isCalibrated = false; 
        let offsetAx = 0, offsetAy = 0;
        let calibCount = 0;

        async function connectSerial() {
            if (!navigator.serial) {
                alert("Trình duyệt không hỗ trợ Web Serial API! Vui lòng dùng Chrome, Edge hoặc Opera trên máy tính.");
                return;
            }
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                const btn = document.getElementById('btnConnect');
                btn.innerText = "CONNECTED";
                btn.classList.add("connected");
                readLoop();
            } catch (err) {
                console.error("Connection failed: ", err);
            }
        }

        async function readLoop() {
            const textDecoder = new TextDecoderStream();
            const readableStreamClosed = port.readable.pipeTo(textDecoder.writable);
            reader = textDecoder.readable.getReader();
            
            let buffer = "";
            try {
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    
                    buffer += value;
                    if (buffer.length > 10000) buffer = ""; // Safeguard against infinite growth
                    let lines = buffer.split('\n');
                    buffer = lines.pop(); 
                    
                    for (let line of lines) {
                        line = line.trim();
                        if (line.length > 0) {
                            parseData(line);
                        }
                    }
                }
            } catch (error) {
                console.error("Read error: " + error);
                showToast("Connection Lost!");
            } finally {
                reader.releaseLock();
                const btn = document.getElementById('btnConnect');
                btn.innerText = "CONNECT";
                btn.classList.remove("connected");
            }
        }

        function parseData(line) {
            try {
                if (line.startsWith("{") && line.endsWith("}")) {
                    const data = JSON.parse(line);
                    
                    // Show raw string on UI to prove dashboard is not frozen
                    document.getElementById('debug-text').innerText = "RAW: " + line;
                    
                    // --- MPU Auto-Calibration ---
                    if (!isCalibrated) {
                        if (calibCount === 0) {
                            document.getElementById('val-kmh').innerText = "CAL";
                            document.getElementById('val-rpm').innerText = "Đang cân bằng...";
                        }
                        if (data.Ax !== undefined && data.Ay !== undefined) {
                            offsetAx += data.Ax;
                            offsetAy += data.Ay;
                            calibCount++;
                            if (calibCount >= 30) { // 3 seconds calibration
                                offsetAx /= 30;
                                offsetAy /= 30;
                                isCalibrated = true;
                                document.getElementById('val-rpm').innerText = "Xong!";
                            }
                        }
                        return; // Wait until calibrated
                    }

                    // 1. Crash State (Ưu tiên kiểm tra đầu tiên để Override dữ liệu)
                    const crashOverlay = document.getElementById('crash-overlay');
                    if (data.Crash === 1) {
                        isCrashedState = true;
                        crashOverlay.style.opacity = 1;
                        
                        // Khắc phục triệt để độ trễ Serial/CAN: 
                        // Ép cứng thông số về trạng thái an toàn ngay trên Frontend
                        data.Ga = 0;
                        data.Phanh = 100;
                        data.RPM = 0;
                    } else {
                        isCrashedState = false;
                        crashOverlay.style.opacity = 0;
                    }

                    // 2. MPU6050 (Map 1.0g to 90 degrees using arcsin)
                    let calibAx = Math.max(-1.0, Math.min(1.0, data.Ax - offsetAx));
                    let calibAy = Math.max(-1.0, Math.min(1.0, data.Ay - offsetAy));
                    
                    targetPitch = Math.asin(calibAy);
                    targetRoll = Math.asin(calibAx);
                    
                    // 3. Pedals (Throttle and Brake Bars)
                    document.getElementById('bar-thr').style.height = data.Ga + "%";
                    document.getElementById('bar-brk').style.height = data.Phanh + "%";
                    
                    // 4. Vòng tua (RPM) và Vận tốc (KM/H)
                    let real_rpm = data.RPM; 
                    let kmh = Math.round(real_rpm * 0.5);
                    
                    document.getElementById('val-kmh').innerText = kmh;
                    document.getElementById('val-rpm').innerText = Math.round(real_rpm) + " RPM";
                    
                    // Cập nhật vòng cung SVG (Max RPM ~ 200)
                    let max_rpm = 200;
                    let rpm_clamped = Math.min(real_rpm, max_rpm);
                    let offset = 377 - (377 * (rpm_clamped / max_rpm));
                    document.getElementById('rpm-arc').style.strokeDashoffset = offset;
                    
                    // 5. Steering Wheel
                    if (data.Steer !== undefined) {
                        targetTurn = ((data.Steer - 127) / 127) * 0.8; 
                    }
                    
                    // 6. ABS State
                    const absIndicator = document.getElementById('abs-indicator');
                    if (data.ABS === 1) {
                        absIndicator.classList.add('active');
                        document.getElementById('bar-brk').style.backgroundColor = '#ffaa00'; // Đổi màu phanh thành vàng khi ABS kích hoạt
                    } else {
                        absIndicator.classList.remove('active');
                        document.getElementById('bar-brk').style.backgroundColor = '#FF3333'; // Đỏ bình thường
                    }

                    // 7. Dynamic Gear & Navigation Distance
                    let gearIndicator = document.getElementById('gear-indicator');
                    
                    // Logic mô phỏng Hộp số (Gear) thực tế hơn:
                    // Đang chạy hoặc đang đạp ga -> Số D
                    if (kmh > 0 || data.Ga > 5) {
                        gearIndicator.innerText = "D";
                        gearIndicator.style.color = "#34c759"; // Green Drive
                    } 
                    // Xe dừng hẳn và đang đạp phanh -> Về P
                    else if (kmh === 0 && data.Phanh > 10) {
                        gearIndicator.innerText = "P";
                        gearIndicator.style.color = "#FF3333"; // Red Park
                        // Auto Unlock khi về P
                        if (isAutoLocked) {
                            setLockState('lock-left', false);
                            setLockState('lock-right', false);
                            setLockState('lock-trunk', false);
                            isAutoLocked = false;
                            showToast("Shifted to P: Doors Unlocked");
                        }
                    } 
                    // Đang dừng, không ga không phanh -> Số N (Hoặc chờ)
                    else {
                        gearIndicator.innerText = "N";
                        gearIndicator.style.color = "#fff"; // Neutral
                    }

                    // Tính năng Auto-Lock cửa như xe hơi đời mới (Kích hoạt khi qua 20 km/h)
                    if (kmh >= 20 && !isAutoLocked) {
                        setLockState('lock-left', true);
                        setLockState('lock-right', true);
                        setLockState('lock-trunk', true);
                        isAutoLocked = true;
                        showToast("Doors Auto-Locked (20 km/h)");
                    }

                    // Simulate map distance reducing based on speed
                    if (kmh > 0) {
                        mapDistance -= (kmh / 3600) * 100; // km/h to m/100ms
                        if (mapDistance < 0) mapDistance = 850;
                        document.getElementById('map-dist').innerText = Math.round(mapDistance);
                    }
                    
                    // 8. Health Diagnostics
                    if (data.EPS_Link !== undefined) {
                        const epsLink = document.getElementById('eps-link');
                        if (epsLink) {
                            epsLink.style.color = data.EPS_Link ? '#34c759' : '#ff3b30';
                            epsLink.innerHTML = data.EPS_Link ? '<i class="fa-solid fa-link"></i> EPS' : '<i class="fa-solid fa-link-slash"></i> EPS';
                        }
                    }
                    if (data.ABS_Link !== undefined) {
                        const absLink = document.getElementById('abs-link');
                        if (absLink) {
                            absLink.style.color = data.ABS_Link ? '#34c759' : '#ff3b30';
                            absLink.innerHTML = data.ABS_Link ? '<i class="fa-solid fa-link"></i> ABS' : '<i class="fa-solid fa-link-slash"></i> ABS';
                        }
                    }
                    if (data.CAN_BusOff !== undefined) {
                        const canBus = document.getElementById('can-bus');
                        if (canBus) {
                            canBus.style.color = data.CAN_BusOff ? '#ff3b30' : '#34c759';
                            canBus.innerHTML = data.CAN_BusOff ? '<i class="fa-solid fa-network-wired"></i> BUS-OFF' : '<i class="fa-solid fa-network-wired"></i> CAN OK';
                        }
                    }
                }
            } catch (e) {
                console.log("JSON Parse Error:", e);
            }
        }

        // --- UI Interactions ---
        let mapDistance = 850;
        let isPlaying = false;
        let isAutoLocked = false;
        const tracks = ["Midnight City", "Starboy", "Blinding Lights", "Nightcall"];
        let currentTrack = 0;
        let toastTimeout;

        function showToast(msg) {
            let toast = document.getElementById('toast-notify');
            toast.innerText = msg;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function setLockState(id, lock) {
            let el = document.getElementById(id);
            let icon = el.querySelector('i');
            if (lock) {
                el.classList.remove('unlocked');
                icon.className = 'fa-solid fa-lock';
            } else {
                el.classList.add('unlocked');
                icon.className = 'fa-solid fa-unlock';
            }
        }

        function toggleLock(el) {
            el.classList.toggle('unlocked');
            let icon = el.querySelector('i');
            if (el.classList.contains('unlocked')) {
                icon.className = 'fa-solid fa-unlock';
                showToast("Door manually unlocked");
            } else {
                icon.className = 'fa-solid fa-lock';
                showToast("Door manually locked");
            }
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            document.getElementById('play-icon').className = isPlaying ? 'fa-solid fa-pause' : 'fa-solid fa-play';
            if (isPlaying) {
                document.getElementById('album-art').classList.add('spinning');
            } else {
                document.getElementById('album-art').classList.remove('spinning');
            }
        }

        function changeTrack(dir) {
            currentTrack += dir;
            if (currentTrack >= tracks.length) currentTrack = 0;
            if (currentTrack < 0) currentTrack = tracks.length - 1;
            document.getElementById('media-title').innerText = tracks[currentTrack];
        }

        function adjTemp(id, dir) {
            let el = document.getElementById(id);
            let val = parseInt(el.innerText);
            val += dir;
            if (val > 30) val = 30;
            if (val < 16) val = 16;
            el.innerText = val + "°C";
        }
    </script>
</body>
</html>
